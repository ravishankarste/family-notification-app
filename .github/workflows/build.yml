name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  build-android:
    name: Build Android APK via EAS Local
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java (Android SDK is pre-installed)
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🛠️ Setup EAS CLI
        run: npm install -g eas-cli

      - name: 🏗️ Build APK (Bypassing Expo Cloud Limits)
        run: eas build -p android --profile preview --local --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FamilyApp-Preview
          path: build/*.apk
          retention-days: 7
